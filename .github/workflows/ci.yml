name: ci

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  php-cs-fixer:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@master
        with:
          php-version: 8.2
          extensions: mbstring, pcov
          coverage: pcov

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "COMPOSER_CACHE_FILES_DIR=$(composer config cache-files-dir)" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_FILES_DIR }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run php-cs-fixer
        run: bin/php-cs-fixer fix --verbose --diff --dry-run

  php-stan:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@master
        with:
          php-version: 8.2
          extensions: mbstring, pcov
          coverage: pcov

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "COMPOSER_CACHE_FILES_DIR=$(composer config cache-files-dir)" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_FILES_DIR }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run PHPStan
        run: bin/phpstan

  test:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      max-parallel: 15
      matrix:
        # latest php on all symfony versions
        operating-system: [ubuntu-22.04]
        php-version: ["8.4"]
        symfony-version: ["6.4", "7.4"]
        include:
          # lowest supported php on each supported symfony version
          - php-version: "8.1"
            operating-system: ubuntu-22.04
            symfony-version: "6.4"
          - php-version: "8.2"
            operating-system: ubuntu-22.04
            symfony-version: "7.4"
          # macos
          - php-version: "8.4"
            operating-system: macos-14
            symfony-version: "7.4"
    name: "${{ matrix.operating-system }}: php/${{ matrix.php-version }} symfony/${{ matrix.symfony-version }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@main
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, pcov
          coverage: pcov

      - name: Check PHP Version
        run: php -v

      - name: Check Composer Version
        run: composer -V

      - name: Check PHP Extensions
        run: php -m

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "COMPOSER_CACHE_FILES_DIR=$(composer config cache-files-dir)" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_FILES_DIR }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}

      - name: Pin Symfony version
        env:
          SYMFONY_VERSION: ${{ matrix.symfony-version }}
        run: |
          composer require --no-update --no-interaction \
            "symfony/framework-bundle:^${SYMFONY_VERSION}" \
            "symfony/expression-language:^${SYMFONY_VERSION}" \
            "symfony/security-http:^${SYMFONY_VERSION}" \
            "symfony/http-kernel:^${SYMFONY_VERSION}" \
            "symfony/property-access:^${SYMFONY_VERSION}"
          composer require --no-update --no-interaction --dev \
            "symfony/stopwatch:^${SYMFONY_VERSION}"

      - name: Install Dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Check resolved Symfony version
        run: composer show symfony/http-kernel | grep versions

      - name: Run phpspec
        run: bin/phpspec run -f dot -n
