name: ci

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  coding-standards:
    name: coding standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Run php-cs-fixer
        run: bin/php-cs-fixer fix --verbose --diff --dry-run

  static-analysis:
    name: static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Run PHPStan
        run: bin/phpstan

  tests:
    name: "php ${{ matrix.php }} / symfony ${{ matrix.symfony }} / ${{ matrix.dependencies }} deps${{ matrix.os && ' / macos' || '' }}"
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.4"]
        symfony: ["6.4", "7.4"]
        dependencies: ["highest"]
        include:
          - php: "8.2"
            symfony: "6.4"
            dependencies: "lowest"
          - php: "8.4"
            symfony: "7.4"
            dependencies: "highest"
            os: "macos-latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - name: Restrict Symfony to ${{ matrix.symfony }}
        env:
          SYMFONY_VERSION: ${{ matrix.symfony }}
        run: |
          composer require --no-update --no-interaction \
            symfony/{framework-bundle,expression-language,security-http,http-kernel,property-access}:"^${SYMFONY_VERSION}"
          composer require --no-update --no-interaction --dev \
            symfony/stopwatch:"^${SYMFONY_VERSION}"

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Report resolved versions
        run: composer show --direct

      - name: Run phpspec
        run: bin/phpspec run -f dot -n
